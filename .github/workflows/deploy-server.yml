name: Deploy Server (Cloudflare Workers)

on:
  push:
    branches:
      - main
      - claude/repo-permissions-check-tptdo0
    paths:
      - apps/server/**
      - packages/rules/**
      - packages/data/**
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @tessera/server typecheck

      - name: Test
        run: pnpm --filter @tessera/server test

      - name: Apply D1 migrations
        run: pnpm --filter @tessera/server db:migrate:remote

      - name: Deploy
        run: pnpm --filter @tessera/server run deploy
