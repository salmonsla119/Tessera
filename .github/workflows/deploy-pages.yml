name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/repo-permissions-check-tptdo0
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      # 규칙 엔진이 깨진 채로 배포되지 않게 테스트를 게이트로 둔다.
      - name: Test rules engine
        run: pnpm --filter @tessera/rules test

      - name: Build
        # apps/server(Cloudflare Workers) 배포 URL. Repository variable로 설정하면
        # 온라인 대전이 활성화되고, 비어 있으면 로컬/AI 대전만 남긴 채 조용히 비활성화된다.
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: pnpm --filter @tessera/web build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
