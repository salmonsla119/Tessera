<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Score App</title>
<style>
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f5f7;
  }
  #score {
    font-size: 4rem;
    font-weight: bold;
    margin-bottom: 2rem;
  }
  button {
    font-size: 1.5rem;
    padding: 0.75rem 2.5rem;
    border: none;
    border-radius: 8px;
    background: #007aff;
    color: white;
    cursor: pointer;
  }
  button:active {
    background: #005bb5;
  }
</style>
</head>
<body>
  <div id="score">Score: 0</div>
  <button id="hello-btn">Hello</button>

  <script>
    let score = 0;
    const scoreEl = document.getElementById('score');
    document.getElementById('hello-btn').addEventListener('click', () => {
      score += 1;
      scoreEl.textContent = `Score: ${score}`;
    });
  </script>
</body>
</html>
